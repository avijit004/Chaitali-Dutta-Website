    <style>
      /* Ensures that the body has some padding and the text is aligned nicely */
      body {
        font-family: "Arial", sans-serif; /* Standard, readable font */
        margin: 0;
        line-height: 1.6;
        color: #333; /* Dark grey text for readability */
        background-color: #f4f4f4; /* Light grey background */
      }

      /* Styles for the image to stretch it to the full container width */
      .post__img {
        padding-left: 20px;
        padding-right: 20px;
        width: 100%; /* Stretches the image to full container width */
        height: auto; /* Keeps the aspect ratio of the image */
        border-bottom: 1px solid #ccc; /* Adds a subtle line under the image */
      }

      /* Title styling for emphasis and readability */
      .post__title {
        padding-left: 20px;
        padding-right: 20px;
        font-size: 24px; /* Large, readable font size */
        color: #000; /* Black color for high contrast and focus */
        margin-top: 20px; /* Adds space above the title */
        margin-bottom: 10px; /* Adds space below the title */
      }

      /* Date styling for subtlety */
      .post__date {
        padding-left: 20px;
        padding-right: 20px;
        font-size: 14px; /* Smaller font size for meta information like dates */
        color: #666; /* Lighter grey to differentiate from main content */
        margin-bottom: 20px; /* Adds space below the date */
      }

      /* Main text styling for optimal reading */
      .post__text {
        padding-left: 20px;
        padding-right: 20px;
        font-size: 18px; /* Slightly larger font size for main content */
        margin-bottom: 20px; /* Adds space below each paragraph */
        text-align: justify; /* Justifies the text for a clean look */
      }

      /* Additional styling for links within the text, if any */
      .post__text a {
        padding: 20px;
        color: #1a0dab; /* Typical link color */
        text-decoration: none; /* Removes underline */
      }

      .post__text a:hover,
      .post__text a:focus {
        text-decoration: underline; /* Adds underline on hover/focus for accessibility */
      }
    </style>
  </head>

        <!-- Theme change button -->
